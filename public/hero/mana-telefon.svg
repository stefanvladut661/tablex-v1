<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="1200" height="1600" role="img" aria-label="">
  <!--
    Mana umana complet alba (mat, modelata doar din griuri reci foarte
    deschise) tinand un telefon negru vertical. Anatomie de mana dreapta:
    patru degete infasurate peste muchia stanga — fiecare cu pulpa distala,
    articulatia DIP marcata prin pliu si nod PIP la iesirea din spatele
    telefonului — police cu unghie discreta pe muchia dreapta, podul palmei
    sub telefon, incheietura cu pliuri spre coltul dreapta-jos.
    Compozitie 3:4, fundal transparent, lumina difuza din stanga-sus.
    Ecranul e negru plin, zero UI: interfata TableX se suprapune in DOM
    (ECRAN_RECT din motion.config.ts e calibrat pe coordonatele de aici:
    ecran x=260 y=184 w=560 h=1182, colturi rx=72 — NU se muta).
  -->
  <defs>
    <!-- Cilindrul degetului: alb pur sus, gri rece abia perceptibil jos -->
    <linearGradient id="alb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#F7F9FC"/>
      <stop offset="1" stop-color="#E3E8F0"/>
    </linearGradient>
    <!-- Masele mari (palma, incheietura): acelasi alb, luminat din stanga-sus -->
    <linearGradient id="albMasa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDFEFF"/>
      <stop offset="0.55" stop-color="#F2F5F9"/>
      <stop offset="1" stop-color="#DFE5EE"/>
    </linearGradient>
    <!-- Umbra de contact: gri neutru, moale, se stinge spre margini -->
    <radialGradient id="umbraContact" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#46536B" stop-opacity="0.28"/>
      <stop offset="0.7" stop-color="#46536B" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#46536B" stop-opacity="0"/>
    </radialGradient>
    <!-- Rama telefonului: negru cald, mai luminos spre stanga-sus -->
    <linearGradient id="ramaTel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#262A33"/>
      <stop offset="0.5" stop-color="#14171E"/>
      <stop offset="1" stop-color="#0B0D12"/>
    </linearGradient>
  </defs>

  <!-- ═══ Incheietura si antebratul: coboara spre dreapta-jos, taiate de cadru ═══ -->
  <path fill="url(#albMasa)" d="
    M 620 1150
    C 760 1110, 930 1130, 1030 1220
    C 1130 1310, 1190 1420, 1235 1560
    L 1290 1700 L 700 1700
    C 640 1540, 590 1420, 565 1330
    C 545 1250, 555 1180, 620 1150 Z"/>
  <!-- lumina de sus pe incheietura -->
  <ellipse cx="880" cy="1240" rx="180" ry="60" fill="#FFFFFF" opacity="0.32" transform="rotate(32 880 1240)"/>
  <!-- osul ulnar (stiloida), bump discret pe conturul incheieturii -->
  <ellipse cx="1120" cy="1352" rx="36" ry="22" fill="#FFFFFF" opacity="0.35" transform="rotate(30 1120 1352)"/>
  <!-- pliurile incheieturii -->
  <path d="M 992 1458 C 1064 1436, 1146 1444, 1210 1486" fill="none" stroke="#C3CCDA" stroke-width="5" stroke-linecap="round" opacity="0.4"/>
  <path d="M 1006 1494 C 1072 1474, 1148 1480, 1206 1516" fill="none" stroke="#C3CCDA" stroke-width="4" stroke-linecap="round" opacity="0.25"/>

  <!-- Podul palmei, vizibil sub marginea de jos a telefonului -->
  <ellipse cx="560" cy="1428" rx="300" ry="96" fill="url(#albMasa)"/>
  <!-- umbra telefonului pe palma -->
  <ellipse cx="552" cy="1398" rx="288" ry="26" fill="url(#umbraContact)" opacity="0.9"/>
  <!-- linia vietii, schitata pe podul palmei -->
  <path d="M 380 1452 C 480 1476, 640 1478, 750 1450" fill="none" stroke="#C9D1DD" stroke-width="4" stroke-linecap="round" opacity="0.35"/>

  <!-- ═══ Telefonul: negru mat, vertical, ecran frontal ═══ -->
  <rect x="236" y="160" width="608" height="1230" rx="96" fill="url(#ramaTel)"/>
  <!-- muchia stanga prinde lumina -->
  <path d="M 296 190 C 262 220, 248 260, 248 320 L 248 1230 C 248 1290, 262 1330, 296 1360"
        fill="none" stroke="#4A5364" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
  <!-- Ecranul: negru plin, zero reflexii, zero UI (aici intra DOM-ul) -->
  <rect x="260" y="184" width="560" height="1182" rx="72" fill="#08090D"/>

  <!-- umbre de separatie intre degete (in spatele lor, dau adancime) -->
  <ellipse cx="208" cy="497" rx="58" ry="22" fill="url(#umbraContact)" opacity="0.55"/>
  <ellipse cx="204" cy="690" rx="58" ry="22" fill="url(#umbraContact)" opacity="0.55"/>
  <ellipse cx="202" cy="882" rx="52" ry="20" fill="url(#umbraContact)" opacity="0.55"/>

  <!-- ═══ Degetele: patru, infasurate peste muchia stanga ═══
       Fiecare deget = falanga medie iesind din spatele telefonului (nodul
       PIP e bombamentul din stanga), pliul articulatiei DIP, apoi pulpa
       distala care se sprijina pe muchie. Mijlociul e cel mai lung,
       micul e mai scurt, mai subtire si mai inclinat — ca la o mana reala. -->

  <!-- aratatorul -->
  <g transform="rotate(-4 240 400)">
    <path fill="url(#alb)" d="
      M 320 348
      C 262 344, 206 346, 176 362
      C 154 374, 146 392, 148 404
      C 150 424, 166 442, 196 450
      C 232 458, 282 458, 320 454 Z"/>
    <ellipse cx="212" cy="372" rx="50" ry="13" fill="#FFFFFF" opacity="0.55" transform="rotate(-6 212 372)"/>
    <ellipse cx="232" cy="436" rx="56" ry="11" fill="#D8DEE9" opacity="0.5"/>
    <path d="M 236 374 C 224 391, 224 409, 236 426" fill="none" stroke="#C3CCDA" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
    <path d="M 250 377 C 240 392, 240 408, 250 423" fill="none" stroke="#C3CCDA" stroke-width="3" stroke-linecap="round" opacity="0.25"/>
  </g>

  <!-- mijlociul (cel mai lung — iese cel mai mult in afara) -->
  <g transform="rotate(-2 240 592)">
    <path fill="url(#alb)" d="
      M 326 538
      C 258 534, 196 536, 166 552
      C 140 566, 132 584, 134 598
      C 136 618, 154 636, 186 644
      C 226 652, 288 652, 326 648 Z"/>
    <ellipse cx="206" cy="562" rx="54" ry="13" fill="#FFFFFF" opacity="0.55" transform="rotate(-5 206 562)"/>
    <ellipse cx="228" cy="630" rx="60" ry="12" fill="#D8DEE9" opacity="0.5"/>
    <path d="M 230 564 C 218 582, 218 602, 230 620" fill="none" stroke="#C3CCDA" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
    <path d="M 244 567 C 234 583, 234 601, 244 617" fill="none" stroke="#C3CCDA" stroke-width="3" stroke-linecap="round" opacity="0.25"/>
  </g>

  <!-- inelarul -->
  <g transform="rotate(-4 240 784)">
    <path fill="url(#alb)" d="
      M 320 732
      C 262 728, 206 730, 176 746
      C 154 758, 146 776, 148 788
      C 150 808, 166 826, 196 834
      C 232 842, 282 842, 320 838 Z"/>
    <ellipse cx="212" cy="756" rx="50" ry="13" fill="#FFFFFF" opacity="0.55" transform="rotate(-6 212 756)"/>
    <ellipse cx="232" cy="820" rx="56" ry="11" fill="#D8DEE9" opacity="0.5"/>
    <path d="M 236 758 C 224 775, 224 793, 236 810" fill="none" stroke="#C3CCDA" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
    <path d="M 250 761 C 240 776, 240 792, 250 807" fill="none" stroke="#C3CCDA" stroke-width="3" stroke-linecap="round" opacity="0.25"/>
  </g>

  <!-- micul (mai scurt, mai subtire, mai inclinat) -->
  <g transform="rotate(-8 244 962)">
    <path fill="url(#alb)" d="
      M 310 920
      C 264 916, 220 918, 196 930
      C 178 940, 172 954, 174 964
      C 176 980, 188 994, 212 1000
      C 242 1008, 282 1008, 310 1004 Z"/>
    <ellipse cx="224" cy="936" rx="40" ry="10" fill="#FFFFFF" opacity="0.55" transform="rotate(-8 224 936)"/>
    <ellipse cx="244" cy="992" rx="44" ry="9" fill="#D8DEE9" opacity="0.5"/>
    <path d="M 248 938 C 238 952, 238 972, 248 986" fill="none" stroke="#C3CCDA" stroke-width="3.5" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- ═══ Policele: doua falange pe muchia dreapta, cu unghie discreta ═══ -->
  <!-- umbra policelui pe rama -->
  <ellipse cx="826" cy="980" rx="38" ry="120" fill="url(#umbraContact)" transform="rotate(8 826 980)"/>
  <!-- corpul policelui: varf rotunjit sus, indoit la articulatia IP,
       baza (eminenta tenara) curgand in palma spre dreapta-jos -->
  <path fill="url(#alb)" d="
    M 828 872
    C 850 844, 888 842, 910 868
    C 928 890, 934 934, 926 978
    C 918 1020, 904 1054, 884 1078
    C 910 1100, 948 1134, 992 1160
    C 1036 1186, 1078 1196, 1108 1186
    L 1162 1318
    C 1058 1330, 948 1278, 870 1198
    C 818 1144, 792 1078, 792 1018
    C 792 966, 802 914, 828 872 Z"/>
  <!-- unghia, abia sugerata pe falanga distala -->
  <ellipse cx="876" cy="898" rx="24" ry="32" fill="#FFFFFF" opacity="0.5" transform="rotate(14 876 898)"/>
  <ellipse cx="876" cy="898" rx="24" ry="32" fill="none" stroke="#CBD4E0" stroke-width="2" opacity="0.4" transform="rotate(14 876 898)"/>
  <!-- lumina pe falanga distala -->
  <ellipse cx="856" cy="944" rx="17" ry="52" fill="#FFFFFF" opacity="0.5" transform="rotate(10 856 944)"/>
  <!-- pliul articulatiei IP -->
  <path d="M 872 1052 C 890 1044, 910 1044, 926 1054" fill="none" stroke="#C3CCDA" stroke-width="4" stroke-linecap="round" opacity="0.45"/>
  <path d="M 878 1068 C 894 1061, 910 1061, 922 1069" fill="none" stroke="#C3CCDA" stroke-width="3" stroke-linecap="round" opacity="0.25"/>
</svg>
